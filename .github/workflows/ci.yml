name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Ruff check
        run: nix develop --accept-flake-config --command ruff check src tests

      - name: Ruff format check
        run: nix develop --accept-flake-config --command ruff format --check src tests

      - name: Compile check
        run: nix develop --accept-flake-config --command python -m compileall -q src tests
